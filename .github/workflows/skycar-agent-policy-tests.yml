name: Skycar autonomous routing policy tests
# PR-triggered, read-only policy verification. Never runs an AI model or accesses secrets.
on:
  pull_request:
    paths:
      - '.github/workflows/skycar-agent-policy-tests.yml'
      - 'scripts/autonomy/**'
      - 'tests/autonomy/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skycar-policy-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate nine-agent routes and protected-task blocking
        run: python3 -m unittest discover -s tests/autonomy -p 'test_*.py' -v
