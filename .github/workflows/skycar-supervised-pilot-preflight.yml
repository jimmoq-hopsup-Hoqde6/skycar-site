name: Skycar supervised coding pilot preflight
# This workflow verifies the reviewed runner and generates an approval fingerprint.
# No API key, paid inference, hosted session, code publishing or unattended schedule.
on:
  workflow_dispatch:
    inputs:
      budget_cents:
        description: 'Proposed session budget in US cents (1-500)'
        required: true
        default: '100'
        type: string
permissions:
  contents: read
concurrency:
  group: skycar-supervised-pilot-preflight
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate bounded budget
        shell: bash
        env:
          BUDGET: ${{ inputs.budget_cents }}
        run: |
          python3 - <<'PY'
          import os, re
          value = os.environ["BUDGET"]
          if not re.fullmatch(r"[0-9]{1,3}", value) or not 1 <= int(value) <= 500:
              raise SystemExit("Invalid budget: expected 1..500 US cents")
          PY
      - name: Checkout exact approved main revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify immutable source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned test dependencies
        run: python3 -m pip install -r scripts/autonomy/requirements-pilot.txt
      - name: Verify autonomy policy and runner tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests/autonomy -p 'test_*.py' -v
      - name: Generate reviewed task preflight artifact
        shell: bash
        env:
          BUDGET: ${{ inputs.budget_cents }}
          EXPECTED_SHA: ${{ github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          mkdir -p pilot-preflight
          python3 scripts/autonomy/bounded_coding_pilot.py \
            --root . --sha "$EXPECTED_SHA" --budget-cents "$BUDGET" \
            > pilot-preflight/preflight.json
          python3 - <<'PY'
          import json
          with open("pilot-preflight/preflight.json", encoding="utf-8") as f:
              obj=json.load(f)
          assert obj["mode"]=="offline_preflight"
          assert obj["network"]=="disabled"
          assert obj["writes"]=="artifact_only"
          assert obj["schedule"]=="none"
          assert obj["budget_mode"]=="session"
          PY
      - name: Upload nonsecret preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skycar-supervised-pilot-preflight
          path: pilot-preflight/preflight.json
          retention-days: 7
