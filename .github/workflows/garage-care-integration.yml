name: Garage Care integration acceptance
on:
  pull_request:
permissions:
  contents: read
jobs:
  combined-postgres:
    strategy:
      fail-fast: false
      matrix:
        revision: [head, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_integration_test_only
          POSTGRES_DB: skycar_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.revision == 'head' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify tested revision
        run: node scripts/verify-ci-checkout.mjs
        env:
          CI_CHECKOUT_MODE: ${{ matrix.revision }}
      - name: Apply every migration and verify the shared Garage/Care boundary
        run: node --test tests/integration/garage-care-db.test.mjs
        env:
          # Disposable CI service only. Never substitute a hosted or live connection.
          GARAGE_CARE_TEST_DATABASE_URL: postgresql://postgres:disposable_integration_test_only@127.0.0.1:5432/skycar_integration_test
